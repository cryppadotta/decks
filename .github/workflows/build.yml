name: Build Bible Knowledge APKG

on:
  push:
    branches: [main]
    paths:
      - build.py
      - requirements.txt
      - decks/**/cards.tsv
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bible-knowledge-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned Anki backend
        run: python -m pip install -r requirements.txt

      - name: Build and verify canonical package
        run: python build.py

      - name: Show package contents
        run: unzip -l dist/bible-knowledge.apkg

      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/bible-knowledge.apkg
          if git diff --cached --quiet; then
            echo "Package unchanged"
          else
            git commit -m "Build Bible Knowledge Anki package"
            git pull --rebase origin main
            git push origin main
          fi
